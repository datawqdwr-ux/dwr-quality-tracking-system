// Firebase ບໍ່ຮັບ undefined / NaN
function clean(v) {
  if (v === undefined) return null;
  if (typeof v === "number" && !isFinite(v)) return null;
  if (Array.isArray(v)) return v.map(clean);
  if (v && typeof v === "object") {
    const o = {};
    Object.keys(v).forEach((k) => { if (v[k] !== undefined) o[k] = clean(v[k]); });
    return o;
  }
  return v;
}
var safeKey = (id) => String(id || `id-${Date.now()}`).replace(/[.#$\[\]\/]/g, "_");
var toList = (val) => val ? Object.keys(val).map((k) => ({ id: val[k] && val[k].id || k, ...val[k] })) : [];

async function seedInitialDataIfNeeded() { /* ບໍ່ໃສ່ຂໍ້ມູນຕົວຢ່າງລົງຖານຂໍ້ມູນຈິງ */ }

// ຂໍ້ມູນໂຄງການທີ່ເຄີຍເກັບໄວ້ໃນເຄື່ອງນີ້ (ຈາກລະບົບເກົ່າ) → ຖາມກ່ອນອັບໂຫລດເຂົ້າຖານຂໍ້ມູນໃໝ່ (ເທື່ອດຽວ)
async function offerLocalMigration() {
  if (localStorage.getItem(MIGRATE_FLAG)) return false;
  localStorage.setItem(MIGRATE_FLAG, "asked");
  const cached = readCache(LOCAL_STORAGE_KEY) || [];
  const demoIds = new Set(INITIAL_PROJECTS.map((p) => p.id));
  const real = cached.filter((p) => p && p.id && !(demoIds.has(p.id) && !p.createdBy));
  if (!real.length) return false;
  const ok = window.confirm(`ພົບຂໍ້ມູນໂຄງການ ${real.length} ລາຍການ ທີ່ເກັບໄວ້ໃນເຄື່ອງນີ້ ຈາກລະບົບເກົ່າ.\n\nຕ້ອງການອັບໂຫລດເຂົ້າຖານຂໍ້ມູນໃໝ່ (Firebase ດຽວກັບລະບົບຄຸນນະພາບນ້ຳ) ບໍ່?`);
  if (!ok) return false;
  const updates = {};
  real.forEach((p) => { updates[`${PATHS.projects}/${safeKey(p.id)}`] = clean({ ...p, migratedAt: new Date().toISOString() }); });
  await update(dbRef(rtdb), updates);
  localStorage.setItem(MIGRATE_FLAG, "done");
  return true;
}

function subscribeToWaterProjects(onUpdate, onError) {
  const cached = readCache(LOCAL_STORAGE_KEY);
  if (cached && cached.length) onUpdate(cached);
  try {
    return onValue(dbRef(rtdb, PATHS.projects), async (snap) => {
      const list = toList(snap.val()).sort((a, b) => String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")));
      if (!list.length) {
        const migrated = await offerLocalMigration().catch((e) => { console.warn(e); return false; });
        if (migrated) return; // ລໍຖ້າຂໍ້ມູນທີ່ອັບໂຫລດ ກັບມາທາງ listener
      }
      writeCache(LOCAL_STORAGE_KEY, list);
      onUpdate(list);
    }, (error) => {
      console.warn("Realtime Database projects listener error:", error);
      if (onError) onError(error);
    });
  } catch (err) {
    if (onError) onError(err);
    return () => {};
  }
}
async function saveProject(project) {
  const updated = { ...project, updatedAt: new Date().toISOString(), createdBy: project.createdBy || FIREBASE_ACCOUNT_EMAIL };
  const list = readCache(LOCAL_STORAGE_KEY) || [];
  const i = list.findIndex((p) => p.id === project.id);
  if (i >= 0) list[i] = updated; else list.unshift(updated);
  writeCache(LOCAL_STORAGE_KEY, list);
  await set(dbRef(rtdb, `${PATHS.projects}/${safeKey(project.id)}`), clean(updated));
}
async function deleteProject(id) {
  writeCache(LOCAL_STORAGE_KEY, (readCache(LOCAL_STORAGE_KEY) || []).filter((p) => p.id !== id));
  await remove(dbRef(rtdb, `${PATHS.projects}/${safeKey(id)}`));
}

function subscribeToDirectMessages(onUpdate) {
  const cached = readCache(LOCAL_MESSAGES_KEY);
  if (cached) onUpdate(cached);
  try {
    return onValue(dbRef(rtdb, PATHS.messages), (snap) => {
      const list = toList(snap.val()).sort((a, b) => String(b.sentAt || "").localeCompare(String(a.sentAt || "")));
      writeCache(LOCAL_MESSAGES_KEY, list);
      onUpdate(list);
    }, (err) => console.warn("messages listener error:", err));
  } catch (e) { return () => {}; }
}
async function sendDirectMessage(msg) {
  const newMsg = { ...msg, id: `msg-${Date.now()}-${Math.random().toString(36).substring(2, 7)}`, sentAt: new Date().toISOString() };
  const list = readCache(LOCAL_MESSAGES_KEY) || [];
  list.unshift(newMsg);
  writeCache(LOCAL_MESSAGES_KEY, list);
  try { await set(dbRef(rtdb, `${PATHS.messages}/${newMsg.id}`), clean(newMsg)); } catch (e) { console.warn("message save error:", e); }
  return newMsg;
}

async function addAuditLog(action, entityName, details, userName = "datawqdwr@gmail.com") {
  const log = { id: `log-${Date.now()}-${Math.random().toString(36).substring(2, 6)}`, action, entityName, details, userName, timestamp: new Date().toISOString() };
  const list = readCache(LOCAL_LOGS_KEY) || [];
  list.unshift(log);
  if (list.length > 200) list.pop();
  writeCache(LOCAL_LOGS_KEY, list);
  try { await set(dbRef(rtdb, `${PATHS.logs}/${log.id}`), clean(log)); } catch (e) { console.warn("audit log save error:", e); }
}
function getAuditLogs() { return readCache(LOCAL_LOGS_KEY) || []; }
function subscribeToAuditLogs(onUpdate, onError) {
  const cached = readCache(LOCAL_LOGS_KEY);
  if (cached) onUpdate(cached);
  try {
    return onValue(dbQuery(dbRef(rtdb, PATHS.logs), limitToLast(150)), (snap) => {
      const list = toList(snap.val()).sort((a, b) => String(b.timestamp || "").localeCompare(String(a.timestamp || "")));
      writeCache(LOCAL_LOGS_KEY, list);
      onUpdate(list);
    }, (err) => { console.warn("auditLogs listener error:", err); if (onError) onError(err); });
  } catch (err) { if (onError) onError(err); return () => {}; }
}

/* --- ບັນຊີຜູ້ໃຊ້ຮ່ວມກັນ: ເກັບຢູ່ system_config/users (ບ່ອນດຽວກັບ ລະບົບຄຸນນະພາບນ້ຳ) ---

  id: "guest", username: "guest", password: "", fullName: "ຜູ້ເບິ່ງທົ່ວໄປ (ຍັງບໍ່ເຂົ້າສູ່ລະບົບ)", position: "", email: "", phone: "",
  organization: "", department: "", role: "viewer", avatarColor: "bg-slate-500", notes: "", createdAt: "", updatedAt: ""

  id: "default-admin", username: "admin", password: "9999", fullName: "Admin (ບັນຊີເລີ່ມຕົ້ນ)", role: "admin",
  notes: "ບັນຊີເລີ່ມຕົ້ນ — ສ້າງບັນຊີ Admin ຂອງທ່ານເອງ ແລ້ວບັນຊີນີ້ຈະປິດເອງ", avatarColor: "bg-blue-600"

function normalizeUser(raw, fallbackId) {

  return {
    id: raw.id || fallbackId || `usr-${Date.now()}`,
    username: String(username).toLowerCase().trim(),
    password: String(raw.password || raw.pin || ""),
    fullName: raw.fullName || raw.name || "ຜູ້ໃຊ້ລະບົບ",
    position: raw.position || "",

    phone: raw.phone || "",

  return clean({ ...rest, id, name: user.username, role: U2Q[user.role] || "VIEWER" });
}

  let out = list;
  if (!out.some((u) => u.role === "admin")) out = [...out, normalizeUser(DEFAULT_ADMIN, "default-admin")];
  if (!list.some((u) => u.role === "officer")) out = [...out, normalizeUser({ id: "default-staff", username: "staff", password: "1234", fullName: "Staff (ບັນຊີເລີ່ມຕົ້ນ)", role: "officer", notes: "ບັນຊີເລີ່ມຕົ້ນ" }, "default-staff")];
  return out;
}
function subscribeToUserProfiles(onUpdate, onError) {
  const cached = readCache(LOCAL_USERS_KEY);
  if (cached && cached.length) onUpdate(withDefaultAdmin(cached.map((u) => normalizeUser(u))));
  try {
    return onValue(dbRef(rtdb, PATHS.users), (snap) => {
      const val = snap.val() || {};
      const list = Object.keys(val).map((k) => normalizeUser({ ...val[k], id: k }, k));
      writeCache(LOCAL_USERS_KEY, list);

async function seedInitialUsersIfNeeded() { /* ບໍ່ສ້າງບັນຊີຕົວຢ່າງ (password123) ໃນຖານຂໍ້ມູນຈິງ */ }
async function saveUserProfile(user) {

}

function exportSystemBackup() {
  const projects = readCache(LOCAL_STORAGE_KEY) || [];
  const messages = readCache(LOCAL_MESSAGES_KEY) || [];
  const logs = readCache(LOCAL_LOGS_KEY) || [];
  const users = readCache(LOCAL_USERS_KEY) || [];
  return JSON.stringify({
    version: "2.0.0",
    exportDate: new Date().toISOString(),
    account: FIREBASE_ACCOUNT_EMAIL,
    firebaseProjectId: firebase_applet_config_default.projectId,
    databaseId: "realtime-database",
    projectsCount: projects.length,
    usersCount: users.length,
    data: { projects, users, messages, logs }
  }, null, 2);
}
async function restoreSystemBackup(jsonString, mode = "replace") {
  const parsed = JSON.parse(jsonString);
  const importedProjects = parsed.data?.projects || parsed.projects || (Array.isArray(parsed) ? parsed : []);
  const importedUsers = parsed.data?.users || parsed.users || [];
  if (!Array.isArray(importedProjects) || importedProjects.length === 0) {
    throw new Error("ໄຟລ໌ Backup ບໍ່ຖືກຕ້ອງ ຫຼື ບໍ່ມີຂໍ້ມູນໂຄງການ (Invalid backup format)");
  }
  const updates = {};
  importedProjects.forEach((p) => { if (p && p.id) updates[`${PATHS.projects}/${safeKey(p.id)}`] = clean({ ...p, updatedAt: new Date().toISOString() }); });
  // ບັນຊີຜູ້ໃຊ້ຈາກ Backup: ຂ້າມບັນຊີຕົວຢ່າງທີ່ໃຊ້ລະຫັດ password123 (ບໍ່ປອດໄພ)
  let skippedUsers = 0;
  if (Array.isArray(importedUsers)) {
    importedUsers.forEach((u) => {
      const nu = normalizeUser(u);
      if (!nu.password || nu.password === "password123") { skippedUsers++; return; }
      updates[`${PATHS.users}/${safeKey(nu.id)}`] = toStoredUser(nu);
    });
  }
  await update(dbRef(rtdb), updates);
  writeCache(LOCAL_STORAGE_KEY, importedProjects);
  await addAuditLog("restore", "ລະບົບຂໍ້ມູນ", `ຟື້ນຟູຂໍ້ມູນໂຄງການຈໍານວນ ${importedProjects.length} ລາຍການ${skippedUsers ? ` (ຂ້າມບັນຊີຕົວຢ່າງ ${skippedUsers})` : ""}`, FIREBASE_ACCOUNT_EMAIL);
  return { count: importedProjects.length };
}

// ປະລິມານນ້ຳ: ແປງເປັນ ຕໍ່ວັນ ແລ້ວຄິດໄລ່ ຕໍ່ເດືອນ (×30) ແລະ ຕໍ່ປີ (×365)
function volumePerDay(p) {
  const v = Number(p && p.waterVolume) || 0;
  const u = p && p.waterVolumeUnit || "m3/day";
  return u === "m3/month" ? v / 30 : u === "m3/year" ? v / 365 : u === "m3/s" ? v * 86400 : v;
}
var calcMonthVolume = (p) => Math.round(volumePerDay(p) * 30 * 100) / 100;
var calcYearVolume = (p) => Math.round(volumePerDay(p) * 365 * 100) / 100;
var fmtVol = (v) => v === undefined || v === null || v === "" ? "" : Number(v).toLocaleString();
// ---- ພິກັດອົງສາ ↔ ທົດສະນິຍົມ ----
// ພິກັດທີ່ໃຊ້ໄດ້: Lat -90..90, Lng -180..180 (ບໍ່ແມ່ນ 0,0)
var validLL = (lat, lng) => {
  const a = Number(lat), b = Number(lng);
  return isFinite(a) && isFinite(b) && Math.abs(a) <= 90 && Math.abs(b) <= 180 && !(a === 0 && b === 0);
};
// ຕົວເລກອົງສາທີ່ພິມຕິດກັນ ເຊັ່ນ 1061149.3 (= 106°11'49.3") → ທົດສະນິຍົມ
function unpackDMSNumber(v, max) {
  const n = Number(v);
  if (!isFinite(n) || Math.abs(n) <= max) return n;
  const [ip, dp = ""] = String(Math.abs(n)).split(".");
  if (ip.length < 5 || ip.length > 7) return n;
  const sec = Number(ip.slice(-2) + (dp ? "." + dp : "")), min = Number(ip.slice(-4, -2)), deg = Number(ip.slice(0, -4));
  if (min >= 60 || sec >= 60 || deg > max) return n;
  return Math.round((deg + min / 60 + sec / 3600) * 1e6) / 1e6 * Math.sign(n);
}
    function parseCoordPart(txt) {
  if (txt === null || txt === undefined) return NaN;
  if (typeof txt === 'number') return txt;
  let t = String(txt).trim().replace(/[′’‘`´]/g, "'").replace(/[″”“]/g, '"').replace(/''/g, '"').replace(/,/g, '.');
  if (!t) return NaN;
  const hemi = (t.match(/[NSEW]|ເໜືອ|ໃຕ້|ຕາເວັນອອກ|ຕາເວັນຕົກ/i) || [''])[0].toUpperCase();
  const nums = t.match(/-?\d+(?:\.\d+)?/g);
  if (!nums) return NaN;
  let [d, m = 0, s = 0] = nums.map(Number);
  if (nums.length === 1 && !/[°º˚d']/.test(t)) {
    // ທົດສະນິຍົມທຳມະດາ (ອາດມີ N/E)
    const v = Number(nums[0]);
    return /^[SW]|ໃຕ້|ຕາເວັນຕົກ/.test(hemi) ? -Math.abs(v) : v;
  }
  if (m >= 60 || s >= 60) return NaN;
  let v = Math.abs(d) + m / 60 + s / 3600;
  if (d < 0 || /^[SW]|ໃຕ້|ຕາເວັນຕົກ/.test(hemi)) v = -v;
  return Math.round(v * 1e6) / 1e6;
}

// ຫາຄູ່ພິກັດໃນຂໍ້ຄວາມ: "17°58'13.0"N 102°35'48.1"E" ຫຼື "17.9703, 102.5967" → { lat, lng }
function parseCoordPair(txt) {

  const t = String(txt).trim().replace(/[′’‘`´]/g, "'").replace(/[″”“]/g, '"');

  let a, b;
  // ມີ N/S ແລະ E/W → ແຍກຕາມຕົວອັກສອນທິດ

  else {
    const nums = t.match(/-?\d+(?:\.\d+)?/g);
    if (!nums) return null;
    if (nums.length === 2) { a = Number(nums[0]); b = Number(nums[1]); }                              // 17.97, 102.59
    else if (nums.length === 6) { a = parseCoordPart(nums.slice(0, 3).join(' ') + '°'); b = parseCoordPart(nums.slice(3).join(' ') + '°'); } // 17 58 13 102 35 48
    else if (nums.length === 4) { a = parseCoordPart(nums.slice(0, 2).join(' ') + '°'); b = parseCoordPart(nums.slice(2).join(' ') + '°'); }
    else return null;
  }
  if (isNaN(a) || isNaN(b)) return null;
  // ລາວ: lat 13–23, lng 100–108 → ຖ້າໃສ່ສະລັບກັນ ໃຫ້ສະລັບຄືນ

}

/* ================================================================

   - ບັນຊີ: system_config/users (ບ່ອນດຽວກັນ)
   - Session: localStorage "waterSession" { key, role, name } ໃຊ້ຮ່ວມກັນ (ບໍ່ຕ້ອງ Login ໃໝ່ເວລາຍ້າຍໄປມາ)
     → Login ຢູ່ລະບົບໃດ ກໍ່ເຂົ້າອີກລະບົບໄດ້ເລີຍ (ໃນແຖບ Browser ດຽວກັນ)
   ================================================================ */
var SHARED_SESSION_KEY = "waterSession";
var CURRENT_USER_KEY = "lao_water_current_user_v2";
var SHARED_DEFAULTS = [
  { username: "admin", password: "9999", role: "SUPER_ADMIN", name: "Admin (ບັນຊີເລີ່ມຕົ້ນ)", uid: "default-admin" },
  { username: "staff", password: "1234", role: "STAFF", name: "Staff (ບັນຊີເລີ່ມຕົ້ນ)", uid: "default-staff" }
];
var normLogin = (v) => String(v || "").trim().toLowerCase();

async function fetchSharedUsers() {
  const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("TIMEOUT")), 8000));
  const snap = await Promise.race([get(dbRef(rtdb, PATHS.users)), timeout]);
  const v = snap.val() || {};
  return Object.keys(v).map((k) => ({ fbKey: k, ...v[k] }));
}
function defaultAccountUser(d) {
  return normalizeUser({ id: d.uid, username: d.username, password: d.password, fullName: d.name, role: d.role, notes: "ບັນຊີເລີ່ມຕົ້ນ" }, d.uid);
}
// ກົດດຽວກັບ ລະບົບຄຸນນະພາບນ້ຳ: ບັນຊີເລີ່ມຕົ້ນໃຊ້ໄດ້ສະເພາະຕອນທີ່ຍັງບໍ່ມີຜູ້ໃຊ້ສິດນັ້ນ
function findSharedAccount(users, username, password) {
  const u = users.find((x) => normLogin(x.name || x.username) === normLogin(username) && String(x.password) === password);
  if (u) return { key: u.fbKey, role: u.role, user: normalizeUser({ ...u, id: u.fbKey }, u.fbKey) };
  const d = SHARED_DEFAULTS.find((x) => x.username === normLogin(username) && x.password === password);
  if (d && !users.some((x) => x.role === d.role)) return { key: "default:" + d.role, role: d.role, user: defaultAccountUser(d) };
  return null;
}
function findBySession(users, sess) {
  if (!sess || !sess.key) return null;
  if (String(sess.key).startsWith("default:")) {
    const d = SHARED_DEFAULTS.find((x) => "default:" + x.role === sess.key);
    return d && !users.some((x) => x.role === d.role) ? { key: sess.key, role: d.role, user: defaultAccountUser(d) } : null;
  }
  const u = users.find((x) => x.fbKey === sess.key);
  return u && u.role === sess.role ? { key: u.fbKey, role: u.role, user: normalizeUser({ ...u, id: u.fbKey }, u.fbKey) } : null;
}

function showSharedLogin() {
  const el = document.getElementById("sharedLoginScreen");
  if (!el) return;
  el.classList.remove("hidden");
  el.style.display = "flex";
  setTimeout(() => document.getElementById("sl_username")?.focus(), 100);
}
function hideSharedLogin() {
  const el = document.getElementById("sharedLoginScreen");
  if (el) { el.classList.add("hidden"); el.style.display = "none"; }
}
function showSharedLoginError(msg) {
  const box = document.getElementById("sl_error");
  document.getElementById("sl_errorText").innerText = msg;
  box.classList.remove("hidden");
  box.style.display = "flex";
  ["sl_username", "sl_password"].forEach((id) => document.getElementById(id).classList.add("sl-bad"));
  const form = document.getElementById("sl_form");
  form.classList.remove("sl-shake"); void form.offsetWidth; form.classList.add("sl-shake");
  const pw = document.getElementById("sl_password");
  pw.value = ""; pw.focus();
}
function clearSharedLoginError() {
  const box = document.getElementById("sl_error");
  if (box) { box.classList.add("hidden"); box.style.display = "none"; }
  ["sl_username", "sl_password"].forEach((id) => document.getElementById(id)?.classList.remove("sl-bad"));
}

async function sharedLogin(e) {
  e.preventDefault();
  const username = document.getElementById("sl_username").value;
  const password = document.getElementById("sl_password").value;
  const btn = document.getElementById("sl_submit");
  btn.disabled = true; btn.innerText = "⏳ ກຳລັງກວດສອບ...";
  try {
    const users = await fetchSharedUsers();
    const acc = findSharedAccount(users, username, password);
    if (!acc) { showSharedLoginError("ຊື່ຜູ້ໃຊ້ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ! ກະລຸນາລອງໃໝ່"); return; }
    localStorage.setItem(SHARED_SESSION_KEY, JSON.stringify({ key: acc.key, role: acc.role, name: acc.user.fullName }));
    sessionStorage.removeItem("guestMode");
    localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(acc.user));
    addAuditLog("login", "ການເຂົ້າສູ່ລະບົບ", `ເຂົ້າສູ່ລະບົບສໍາເລັດ: @${acc.user.username} (${acc.user.fullName})`, `${acc.user.fullName} (@${acc.user.username})`).catch(() => {});
    location.reload(); // ໂຫລດໃໝ່ ໃຫ້ທຸກສ່ວນຂອງລະບົບເຫັນຜູ້ໃຊ້ທີ່ເຂົ້າ
  } catch (err) {
    showSharedLoginError(err && err.message === "TIMEOUT" ? "ເຊື່ອມຕໍ່ຖານຂໍ້ມູນຊ້າເກີນໄປ ກະລຸນາກວດອິນເຕີເນັດ ແລ້ວລອງໃໝ່" : "ເຊື່ອມຕໍ່ຖານຂໍ້ມູນບໍ່ໄດ້ ກະລຸນາກວດອິນເຕີເນັດ ແລ້ວລອງໃໝ່");
  } finally {
    btn.disabled = false; btn.innerText = "🔓 ເຂົ້າສູ່ລະບົບ";
  }
}
function sharedGuest() {
  sessionStorage.setItem("guestMode", "true");
  localStorage.removeItem(SHARED_SESSION_KEY); sessionStorage.removeItem(SHARED_SESSION_KEY);
  const hadUser = !!localStorage.getItem(CURRENT_USER_KEY);
  localStorage.removeItem(CURRENT_USER_KEY);
  hideSharedLogin();
  if (hadUser) location.reload();
}
function sharedLogout() {
  localStorage.removeItem(SHARED_SESSION_KEY); sessionStorage.removeItem(SHARED_SESSION_KEY);
  sessionStorage.removeItem("guestMode");
  localStorage.removeItem(CURRENT_USER_KEY);
  showSharedLogin();
}
window.showSharedLogin = showSharedLogin;
window.sharedLogout = sharedLogout;

(async function startSharedAuth() {
  document.getElementById("sl_form")?.addEventListener("submit", sharedLogin);
  document.getElementById("sl_guest")?.addEventListener("click", sharedGuest);
  ["sl_username", "sl_password"].forEach((id) => document.getElementById(id)?.addEventListener("input", clearSharedLoginError));
  document.getElementById("sl_pwToggle")?.addEventListener("click", () => {
    const el = document.getElementById("sl_password");
    el.type = el.type === "password" ? "text" : "password";
    document.getElementById("sl_pwToggle").innerText = el.type === "password" ? "👁️" : "🙈";
  });

  let sess = null;
  try { sess = JSON.parse(localStorage.getItem(SHARED_SESSION_KEY) || sessionStorage.getItem(SHARED_SESSION_KEY) || "null"); } catch (e) {}
  const guest = sessionStorage.getItem("guestMode") === "true";

  if (sess) {
    try {
      const acc = findBySession(await fetchSharedUsers(), sess);
      if (acc) {
        localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(acc.user));
        hideSharedLogin();
        return mountApp();
      }
      localStorage.removeItem(SHARED_SESSION_KEY); sessionStorage.removeItem(SHARED_SESSION_KEY); // ບັນຊີຖືກລົບ ຫຼື ປ່ຽນສິດ
    } catch (e) {
      // ເນັດຂາດ: ໃຊ້ຜູ້ໃຊ້ທີ່ຈື່ໄວ້ໃນເຄື່ອງໄປກ່ອນ
      if (localStorage.getItem(CURRENT_USER_KEY)) { hideSharedLogin(); return mountApp(); }
    }
  }
  localStorage.removeItem(CURRENT_USER_KEY);
  mountApp();
  if (guest) hideSharedLogin(); else showSharedLogin();
})();
